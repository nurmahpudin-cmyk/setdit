services:
  setdit-db:
    image: postgres:15-alpine
    container_name: setdit-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=PKPS@2020
      - POSTGRES_DB=setdit
    volumes:
      - ./data-trace:/var/lib/postgresql/data
      # Dijalankan otomatis HANYA saat postgres-data masih kosong (init pertama)
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d setdit"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - setdit-network

  setdit-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: setdit-backend
    ports:
      - "5100:5100"
    environment:
      - NODE_ENV=production
      - PORT=5100
      - DATABASE_URL=postgresql://postgres:PKPS%402020@setdit-db:5432/setdit?schema=public
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-your-super-secret-refresh-key-change-in-production}
      - ADMIN_EMAIL=admin@setdit.local
      - ADMIN_PASSWORD=Admin123!
    volumes:
      - ./backend/uploads:/app/uploads
      - setdit-wa-auth:/app/.wwebjs_auth
      - setdit-wa-cache:/app/.wwebjs_cache
    shm_size: '1gb'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      setdit-db:
        condition: service_healthy
    networks:
      - setdit-network

  setdit-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/kawalps/api
        - VITE_BASE_PATH=/kawalps/
    container_name: setdit-frontend
    ports:
      - "80:5101"
      - "443:5443"
    volumes:
      - ./frontend/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    depends_on:
      - setdit-backend
    networks:
      - setdit-network

networks:
  setdit-network:
    driver: bridge

volumes:
  setdit-wa-auth:
  setdit-wa-cache:
